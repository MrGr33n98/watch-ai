name: Wear OS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wear:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/wear
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: "false"
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install Android 17 preview SDK
        run: android sdk install --canary platforms/android-37 build-tools/37.0.0

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.6.0"

      - name: Run Wear JVM tests and assemble debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug

      - name: Upload Wear JVM test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-ai-wear-test-reports
          path: apps/wear/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm || true
          fi
          ls -la /dev/kvm || true

      - name: Run Wear UI tests on a round emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          emulator-boot-timeout: 600
          disable-animations: true
          working-directory: apps/wear
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p build/screenshots
            adb exec-out run-as com.watchai cat files/watch-ai-question-detail.png > build/screenshots/watch-ai-question-detail.png
            sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
            sha256sum build/screenshots/watch-ai-question-detail.png > build/screenshots/watch-ai-question-detail.png.sha256

      - name: Upload Wear UI test reports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-ai-wear-ui-validation
          path: |
            apps/wear/app/build/reports/androidTests/connected/
            apps/wear/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watch-ai-wear-debug
          path: |
            apps/wear/app/build/outputs/apk/debug/app-debug.apk
            apps/wear/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
