[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watch-ai-api"
version = "0.1.0"
description = "Private study exercise ingestion and verified solution API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=13,<14",
  "pint>=0.24,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "sympy>=1.13,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "pyyaml>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true
